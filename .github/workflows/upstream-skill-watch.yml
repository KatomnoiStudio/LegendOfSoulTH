name: Upstream Skill Watch

# ตรวจ freshtechbro/claudedesignskills (แหล่งของ .claude/skills/react-three-fiber
# + threejs-webgl ที่ vendor เข้ามา) และ affaan-m/ECC (global rules ที่ cherry-pick มือ
# ตาม SKILL_REGISTRY.md) ว่ามี commit ใหม่กว่าที่เรารู้ไหม — ถ้ามี เปิด issue แจ้งพร้อมลิงก์
# compare ให้ไปตรวจว่าควร re-vendor/cherry-pick อัปเดตหรือไม่ ไม่ auto-apply อะไรเอง

on:
  schedule:
    - cron: '0 3 * * 1' # ทุกวันจันทร์ 03:00 UTC
  workflow_dispatch:

# เพดานของ workflow เป็นอ่านอย่างเดียว สิทธิ์เขียนประกาศที่ job ที่ต้องใช้จริงเท่านั้น
permissions:
  contents: read

jobs:
  watch:
    name: Check upstream skill sources for new commits
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit state.json ลงกิ่งใหม่ + push (step สุดท้าย — ไม่ใช่ push ตรงเข้า master)
      issues: write # เปิด/คอมเมนต์ issue แจ้งของใหม่
      pull-requests: write # เปิด PR ให้ state.json (master เป็น protected branch, bot ไม่ได้อยู่ใน bypass list)
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: ตรวจ SHA ล่าสุดของแต่ละแหล่ง เทียบกับที่บันทึกไว้
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          STATE=".github/upstream-watch/state.json"
          UPDATED=false
          BODY_FILE="$(mktemp)"
          echo "" > "$BODY_FILE"

          # tr -d '\r' กันเหนียว — jq/gh บาง runner (เช่น Windows local test) แทรก \r
          # ปนใน raw output ได้ ถึงแม้ ubuntu-latest จริงไม่ควรเจอ
          for repo in $(jq -r 'keys[]' "$STATE" | tr -d '\r'); do
            branch="$(jq -r --arg r "$repo" '.[$r].branch' "$STATE" | tr -d '\r')"
            old_sha="$(jq -r --arg r "$repo" '.[$r].sha' "$STATE" | tr -d '\r')"
            note="$(jq -r --arg r "$repo" '.[$r].note' "$STATE" | tr -d '\r')"

            new_sha="$(gh api "repos/$repo/commits/$branch" --jq .sha | tr -d '\r')"

            if [ "$new_sha" = "$old_sha" ]; then
              echo "$repo: ไม่มีอะไรใหม่ ($old_sha)"
              continue
            fi

            # compare พังได้จริงถ้า upstream force-push จน old_sha หายไปจากประวัติ (404)
            # ปล่อยให้ set -e ฆ่า step จะทำให้ watch นี้แดงทุกวันจันทร์จนกว่าจะมีคนแก้
            # state.json ด้วยมือ — แจ้งเท่าที่รู้แล้วไปต่อดีกว่าหยุดทั้งงาน
            if compare_json="$(gh api "repos/$repo/compare/$old_sha...$new_sha" 2>/dev/null)"; then
              ahead_by="$(echo "$compare_json" | jq -r .ahead_by | tr -d '\r')"
              compare_url="$(echo "$compare_json" | jq -r .html_url | tr -d '\r')"
            else
              ahead_by="?"
              compare_url="https://github.com/$repo/commits/$branch (เทียบตรง ๆ ไม่ได้ — SHA เดิมอาจถูก force-push ทับไปแล้ว)"
            fi

            echo "$repo: เจอ $ahead_by commit ใหม่ ($old_sha -> $new_sha)"
            {
              echo "## \`$repo\`"
              echo ""
              echo "- ใช้เพื่อ: $note"
              echo "- commit ใหม่กว่าที่บันทึกไว้ **$ahead_by** ตัว"
              echo "- เทียบ: $compare_url"
              echo "- SHA เดิม -> ใหม่: \`$old_sha\` -> \`$new_sha\`"
              echo ""
            } >> "$BODY_FILE"

            jq --arg r "$repo" --arg s "$new_sha" '.[$r].sha = $s' "$STATE" > "$STATE.tmp" && mv "$STATE.tmp" "$STATE"
            UPDATED=true
          done

          echo "updated=$UPDATED" >> "$GITHUB_OUTPUT"
          echo "body_file=$BODY_FILE" >> "$GITHUB_OUTPUT"

      - name: เปิด issue แจ้งถ้ามีของใหม่ (ข้ามถ้ามี issue เปิดค้างอยู่แล้ว)
        if: steps.check.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # ส่งผ่าน env ไม่แทรก ${{ }} ลงในตัว run โดยตรง — รูปแบบเดียวกับ GH_TOKEN ข้างบน
          # ค่านี้เป็น path จาก mktemp จึงไม่มีอักขระอันตราย แต่ไม่ทิ้งรูปแบบที่ผิดไว้ให้ลอกต่อ
          BODY_FILE: ${{ steps.check.outputs.body_file }}
        run: |
          set -euo pipefail
          TITLE="Upstream skill source(s) have new commits"
          existing="$(gh issue list --search "\"$TITLE\" in:title is:open" --json number --jq '.[0].number // empty')"

          # สร้าง label ถ้ายังไม่มี (idempotent — เงียบถ้ามีอยู่แล้ว) กัน issue create พังเพราะ
          # label ไม่มีจริงในบาง repo
          gh label create "dependencies" --color "0366d6" --description "อัปเดตจาก dependency/แหล่งภายนอก" 2>/dev/null || true

          if [ -n "$existing" ]; then
            echo "issue #$existing เปิดค้างอยู่แล้ว — เพิ่ม comment แทนเปิดใหม่ซ้ำ"
            gh issue comment "$existing" --body-file "$BODY_FILE"
          else
            gh issue create \
              --title "$TITLE" \
              --label "dependencies" \
              --body-file "$BODY_FILE"
          fi

      # เจอจริง 2026-08-08 — push ตรงเข้า master โดน branch protection บล็อก "protected branch
      # hook declined" เพราะ github-actions[bot] ไม่ได้อยู่ใน bypass allowlist ของ Ring 0
      # (ตั้งใจ — ดู ring0-traffic-control-law.md) เปิด PR เหมือน contributor คนอื่นแทน
      - name: บันทึก SHA ใหม่ผ่าน PR
        if: steps.check.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="upstream-watch/state-$(date -u +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add .github/upstream-watch/state.json
          git commit -m "chore: update upstream-skill-watch state [skip ci]"
          git push origin "$BRANCH"

          # ตั้งแต่ 2026-08-08 ขั้นนี้ล้มทุกครั้งด้วย "GitHub Actions is not permitted to create
          # or approve pull requests" เพราะ repo/org ปิดสวิตช์นั้นไว้ — branch ถูก push สำเร็จ
          # ไปแล้วก่อนหน้า ทำให้ทุกรอบที่ล้มทิ้งกิ่งร้างไว้หนึ่งกิ่ง (สะสมไปแล้ว 2 กิ่งก่อนแก้นี้)
          #
          # เก็บกิ่งทิ้งเมื่อเปิด PR ไม่ได้ แต่ **ยังปล่อยให้ step นี้แดงเหมือนเดิม** — state.json
          # ไม่ได้ถูกบันทึกจริง ๆ ตัวเฝ้าจึงเดินหน้าไม่ได้ นั่นคือสถานะที่พังจริง การทำให้เขียว
          # คือการปิดปากสัญญาณที่ถูกต้อง ไม่ใช่การแก้ปัญหา
          #
          # เปิดใช้งานเต็มรูปแบบได้ด้วยสวิตช์เดียว: Settings → Actions → General →
          # Workflow permissions → "Allow GitHub Actions to create and approve pull requests"
          # (ระดับ org ก็ปิดทับได้ ถ้าเปิดที่ repo แล้วยังล้ม ให้ดูที่ org ด้วย)
          if gh pr create \
            --title "chore: update upstream-skill-watch state" \
            --body "Auto-generated after detecting new upstream commits (see the linked issue). Safe to merge — only updates the last-seen SHA in \`.github/upstream-watch/state.json\`, no source/rule content changed here." \
            --base master \
            --head "$BRANCH"
          then
            exit 0
          fi

          echo "::error::เปิด PR ไม่สำเร็จ — ลบกิ่ง $BRANCH ทิ้งแล้วเพื่อไม่ให้ค้างเป็นกิ่งร้าง"
          echo "::error::ถ้าเป็น 'GitHub Actions is not permitted to create or approve pull requests' ให้เปิดที่ Settings → Actions → General → Workflow permissions"
          echo "::error::issue แจ้งของใหม่ถูกเปิด/คอมเมนต์ไปแล้วในขั้นก่อนหน้า — ที่หายไปคือการบันทึก SHA ล่าสุด ตัวเฝ้าจึงจะแจ้งซ้ำในรอบถัดไป"
          git push origin --delete "$BRANCH" || echo "::warning::ลบกิ่ง $BRANCH ไม่สำเร็จ ต้องลบเอง"
          exit 1
