name: Deploy to GitHub Pages

# Fork-only (nustanakritwithai/GameTurnBase)
# Deploy เฉพาะกิจ — ไม่รันตอน push อัตโนมัติ
# อยากเทส → ให้ AI / คนกด workflow_dispatch (Actions → Deploy → Run workflow)

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'ปล่อยเว็บแม้ version ยังไม่เปลี่ยน'
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-fork
  cancel-in-progress: true

jobs:
  gate:
    name: Check whether the version was bumped
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: เทียบเวอร์ชันเกมกับก่อน push
        id: check
        run: |
          set -euo pipefail
          GAME_INFO='src/game/gameInfo.ts'

          read_version() {
            node -e "
              const src = require('fs').readFileSync(process.argv[1], 'utf8')
              const m = src.match(/version:\s*'([^']+)'/)
              if (!m) { console.error('อ่าน GAME_INFO.version จาก ' + process.argv[1] + ' ไม่ได้'); process.exit(1) }
              process.stdout.write(m[1])
            " "$1"
          }

          version="$(read_version "$GAME_INFO")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "สั่งด้วยมือ — ปล่อยเลย (v$version)"
          echo "should_deploy=true" >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    if: needs.gate.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint Code
        run: npm run lint

      - name: Run Tests
        run: npm test

      - name: Build Application
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Upload SBOM for the release job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
        with:
          timeout: 1800000

  release:
    name: Publish the GitHub Release for this version
    runs-on: ubuntu-latest
    needs: [ gate, deploy ]
    permissions:
      contents: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download the SBOM built in this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom

      - name: Create the release if this version doesn't have one yet
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag มี release อยู่แล้ว — ข้าม"
            exit 0
          fi

          notes_file="$(mktemp)"
          if awk "/^## \[$VERSION\]/{flag=1;next} /^## \[/{flag=0} flag" CHANGELOG.md > "$notes_file" && [ -s "$notes_file" ]; then
            gh release create "$tag" --title "$tag" --notes-file "$notes_file" sbom.cdx.json
          else
            echo "ไม่พบหัวข้อ $VERSION ใน CHANGELOG.md — ให้ GitHub สรุปจาก commit แทน"
            gh release create "$tag" --title "$tag" --generate-notes sbom.cdx.json
          fi
