name: Deploy to GitHub Pages

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '**/*.md'
      - '.agents/**'
      - '.coalmine.json'
      - '.github/upstream-watch/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      # สำหรับ SBOM + build provenance attestation ด้านล่าง (actions/attest)
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint Code
        run: npm run lint

      # ไม่รัน build:models ที่นี่ตั้งใจ — ไม่มีโค้ดใน src/ โหลด .glb ใช้ (เกมเรนเดอร์ sprite 2D แทน,
      # ดู tools/build-models.mjs หัวไฟล์) การรันสคริปต์ยังตรวจสอบใน ci.yml เป็น canary อยู่
      # รันที่นี่แล้ว copy เข้า dist/ จะสิ้นเปลือง CI minutes + ส่ง asset ที่ไม่มีใครใช้ขึ้น production เปล่า ๆ

      - name: Build Application
        run: npm run build

      - name: Generate SBOM
        run: npm sbom --sbom-format=cyclonedx > sbom.cdx.json

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: 'dist/**'

      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: 'dist/**'
          sbom-path: 'sbom.cdx.json'

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      # ป้องกันหลายรัน deploy พร้อมกันตอน push ถี่ ๆ (พบว่า concurrency.cancel-in-progress
      # ด้านบนไม่ทันคืนคำสั่ง Pages API ที่ยิงไปแล้ว หลายรันจึงไปค้าง "deployment_queued"
      # แล้ว timeout พร้อมกัน — 2026-08-06, gh run 31100107280/31101039697)
      #
      # เดิมเช็คว่า commit นี้ยังเป็นปลาย master ไหม ถ้าไม่ใช่ก็ข้าม โดยหวังว่า "รันของ commit
      # ล่าสุดจะ deploy แทน" — แต่สมมติฐานนั้นผิดเมื่อ commit ที่มาแซงเป็นไฟล์ที่ paths-ignore
      # กรองทิ้ง (เช่น docs/*.md) เพราะ commit แบบนั้น **ไม่ทำให้เกิด run เลย** สายส่งต่อจึงขาด
      # กลางทางและเว็บค้างอยู่ที่ build เก่าโดยที่ทุก job รายงานว่า success
      # (เจอจริง 2026-08-06: run #6 ข้ามให้ 66fcfd7 ซึ่งเป็น docs(memory) ล้วน → ไม่มีรันตามมา)
      #
      # เลยเปลี่ยนเกณฑ์จาก "มี commit ใหม่กว่าไหม" เป็น "มี **รันของ workflow นี้** ที่ใหม่กว่า
      # และยังไม่จบไหม" ซึ่งเป็นเงื่อนไขที่ตรงกับเจตนาจริง คือข้ามเฉพาะตอนที่รู้แน่ว่ามีคนอื่น
      # กำลังจะ deploy ให้ ไม่ใช่เดาจาก sha
      - name: รอ push ถี่ตกตะกอนก่อน deploy
        id: debounce
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 30
          # เช็ค API พังก็ไม่ควรทำให้ job ทั้งใบแดง (นี่แค่กันเคสถี่ ไม่ใช่ gate ความถูกต้อง) —
          # เช็คไม่ได้ = ถือว่าไม่มีใครมาแทน ปล่อย deploy ตามปกติ ปลอดภัยกว่าข้ามแล้วเว็บค้าง
          newer="$(gh api \
            "repos/${{ github.repository }}/actions/workflows/deploy.yml/runs?branch=master&per_page=20" \
            --jq '[.workflow_runs[]
                   | select(.status == "queued" or .status == "in_progress")
                   | select(.run_number > ${{ github.run_number }})]
                  | length' || echo 0)"
          if [ "${newer:-0}" -gt 0 ]; then
            echo "มีรัน deploy ที่ใหม่กว่ากำลังทำงานอยู่ ($newer รัน) — ข้าม deploy รอบนี้"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "ไม่มีรันที่ใหม่กว่า — deploy ต่อ"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # ตัว debounce ด้านบนกันแค่ "รันซ้อนกันในหน้าต่างสั้น ๆ" แต่ไม่ได้กัน "ยิง deployment
      # ใหม่ทับกองคิวที่ค้างอยู่แล้ว" — พบจริง 2026-08-06 (gh run 31106222751/31107374696):
      # ช่วง push ถี่ต่อเนื่องหลายชั่วโมง คิว Pages ของ repo นี้ล้นสะสม แต่ละ deployment
      # (แม้รอบที่ "success") ค้างคิว 10–50+ นาที เช็คสถานะ Deployments API พบว่า repo นี้
      # ยิง deploy ถี่กว่าที่ backend ของ Pages รับไหว (60+ ครั้งใน 18 ชม.) — ยิงใหม่ซ้อนกอง
      # ที่ค้างอยู่มีแต่ทำให้แย่ลง จึงเช็คก่อนว่า deployment ล่าสุดของ environment นี้จบสถานะ
      # (success/failure/error/inactive) แล้วหรือยัง ถ้ายังไม่จบ ข้ามรอบนี้ไปเลย ให้ push ถัดไป
      # (หรือรอบถัดมาหลังคิวโล่ง) จัดการแทน
      - name: กันยิง deploy ซ้อนคิวที่ยังค้างอยู่
        id: queue-check
        if: steps.debounce.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_id="$(gh api "repos/${{ github.repository }}/deployments?environment=github-pages&per_page=1" --jq '.[0].id // empty' || echo '')"
          if [ -z "$latest_id" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          state="$(gh api "repos/${{ github.repository }}/deployments/$latest_id/statuses?per_page=1" --jq '.[0].state // empty' || echo '')"
          case "$state" in
            queued|in_progress|pending)
              echo "deployment ล่าสุด ($latest_id) ยังค้างสถานะ $state — คิว Pages ยังไม่ว่าง ข้าม deploy รอบนี้กันซ้อนกองที่ค้างอยู่"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "skip=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      # timeout ปริยายของ action คือ 10 นาที ซึ่งสั้นเกินไปเมื่อคิว Pages หนา — เจอจริง
      # 2026-08-06 หลาย run ค้าง "deployment_queued" แล้วตายที่ 10:00 นาทีเป๊ะ (run #5, #7)
      # ทำให้เว็บค้างที่ build เก่าทั้งที่ merge ไปหลายรอบแล้ว ยืดเป็น 30 นาที
      - name: Deploy to GitHub Pages
        if: steps.debounce.outputs.skip != 'true' && steps.queue-check.outputs.skip != 'true'
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
        with:
          timeout: 1800000
