name: Deploy to GitHub Pages

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '**/*.md'
      - '.agents/**'
      - '.coalmine.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      # สำหรับ SBOM + build provenance attestation ด้านล่าง (actions/attest)
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint Code
        run: npm run lint

      # ไม่รัน build:models ที่นี่ตั้งใจ — ไม่มีโค้ดใน src/ โหลด .glb ใช้ (เกมเรนเดอร์ sprite 2D แทน,
      # ดู tools/build-models.mjs หัวไฟล์) การรันสคริปต์ยังตรวจสอบใน ci.yml เป็น canary อยู่
      # รันที่นี่แล้ว copy เข้า dist/ จะสิ้นเปลือง CI minutes + ส่ง asset ที่ไม่มีใครใช้ขึ้น production เปล่า ๆ

      - name: Build Application
        run: npm run build

      - name: Generate SBOM
        run: npm sbom --sbom-format=cyclonedx > sbom.cdx.json

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: 'dist/**'

      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: 'dist/**'
          sbom-path: 'sbom.cdx.json'

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      # ป้องกันหลายรัน deploy พร้อมกันตอน push ถี่ ๆ (พบว่า concurrency.cancel-in-progress
      # ด้านบนไม่ทันคืนคำสั่ง Pages API ที่ยิงไปแล้ว หลายรันจึงไปค้าง "deployment_queued"
      # แล้ว timeout พร้อมกัน — 2026-08-06, gh run 31100107280/31101039697) รอเผื่อ push ถี่
      # ตกตะกอนก่อน แล้วเช็คว่า commit นี้ยังเป็นปลาย master จริงไหม ถ้าไม่ใช่ (มี push ใหม่
      # แซงเข้ามาระหว่างรอ) ข้ามการ deploy รอบนี้ไปเลย ให้รันของ commit ล่าสุดจัดการแทน
      - name: รอ push ถี่ตกตะกอนก่อน deploy
        id: debounce
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 30
          # เช็ค API พังก็ไม่ควรทำให้ job ทั้งใบแดง (นี่แค่กันเคสถี่ ไม่ใช่ gate ความถูกต้อง) —
          # เช็คไม่ได้ = ถือว่ายังเป็นปลาย master อยู่ ปล่อย deploy ตามปกติ
          latest_sha="$(gh api "repos/${{ github.repository }}/commits/master" --jq .sha || echo "${{ github.sha }}")"
          if [ "$latest_sha" != "${{ github.sha }}" ]; then
            echo "commit ${{ github.sha }} ไม่ใช่ปลาย master แล้ว (ปัจจุบันคือ $latest_sha) — ข้าม deploy รอบนี้"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to GitHub Pages
        if: steps.debounce.outputs.skip != 'true'
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
