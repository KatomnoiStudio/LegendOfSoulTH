# Docs-only PRs skip the heavy CI matrix (ci.yml paths-ignore) but branch protection
# still requires a check named "Continuous Integration". This lightweight gate
# runs only when every changed file is markdown/docs config — same name, instant pass.
name: Build, Typecheck and Lint (docs gate)

on:
  pull_request:
    branches: [master]
    paths:
      - '**/*.md'
      - '.agents/**'
      - '.coalmine.json'
      - '.github/upstream-watch/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-status:
    name: Continuous Integration
    runs-on: ubuntu-latest
    steps:
      - name: Docs-only PR — satisfy required check without full matrix
        run: |
          echo "Markdown/docs-only diff: full CI matrix skipped by ci.yml paths-ignore."
          echo "No typecheck/lint/test/build needed for MEMORY.md / TASKS.md / agents docs."
