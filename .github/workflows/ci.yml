name: Build, Typecheck and Lint

# Fork CI — ตรวจโค้ดเท่านั้น ไม่ sync / ไม่ watch upstream

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '**/*.md'
      - '.agents/**'
      - '.coalmine.json'
  pull_request:
    branches: [ master ]
    paths-ignore:
      - '**/*.md'
      - '.agents/**'
      - '.coalmine.json'

concurrency:
  group: ci-fork-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type Check
        run: npm run typecheck

      - name: Lint Code
        run: npm run lint

      - name: Run Tests
        run: npm run test

      - name: Build Application
        run: npm run build
