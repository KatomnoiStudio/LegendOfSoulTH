name: Build, Typecheck and Lint

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '**/*.md'
      - '.agents/**'
      - '.coalmine.json'
      - '.github/upstream-watch/**'
  pull_request:
    branches: [ master ]
    paths-ignore:
      - '**/*.md'
      - '.agents/**'
      - '.coalmine.json'
      - '.github/upstream-watch/**'

# push ถี่มาก (หลาย dev, หลาย commit ต่อนาที) — push ใหม่ยกเลิกรันเก่าที่ยังไม่จบ
# แทนที่จะปล่อยให้ build+test+lint เต็มรอบทุก push ที่มีอันใหม่กว่ามาแซงอยู่แล้ว
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build 3D Models
        run: npm run build:models

      - name: Type Check
        run: npm run typecheck

      - name: Lint Code
        run: npm run lint

      - name: Run Tests
        run: npm run test

      - name: Build Application
        run: npm run build

      - name: Report bundle size
        # ไม่ต้องสมัคร external service — แค่ print ขนาด chunk ทุก build ลง log
        # เทียบ trend เองได้จาก run history (Actions > this workflow > ผลลัพธ์ย้อนหลัง)
        run: |
          # pipefail จำเป็น: shell ปริยายของ run: คือ bash -e ซึ่งไม่มี pipefail
          # สถานะของไปป์จึงมาจาก sort ตัวท้ายเสมอ ถ้า du หาไฟล์ไม่เจอ (เช่น CSS ถูก
          # inline หมด หรือ assetsDir เปลี่ยน) step นี้จะรายงานเขียวพร้อมกล่องโค้ดว่าง
          set -o pipefail
          echo "### Bundle size (dist/assets)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          du -h dist/assets/*.js dist/assets/*.css | sort -rh >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
