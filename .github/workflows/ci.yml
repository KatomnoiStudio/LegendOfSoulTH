name: Build, Typecheck and Lint

on:
  push:
    branches: [master]
    paths-ignore:
      - '**/*.md'
      - '.agents/**'
      - '.coalmine.json'
      - '.github/upstream-watch/**'
  # ไม่มี paths-ignore ฝั่ง pull_request โดยตั้งใจ — branch protection บังคับ check ชื่อ
  # "Continuous Integration" ไว้ ถ้า workflow นี้ไม่ทริกเกอร์ check นั้นจะไม่มีใครรายงานเลย
  # และ PR ค้างตลอดกาล เดิมแก้ด้วย ci-docs-gate.yml ที่ประกาศ job ชื่อซ้ำกันเป๊ะ ผลคือ PR ที่
  # แตะทั้ง .md และ .ts ยิงทั้งสอง workflow แล้วมี check ชื่อเดียวกันสองอัน (GitHub `paths`
  # = "ไฟล์ที่เปลี่ยนตรงอย่างน้อยหนึ่งไฟล์ก็รัน" ไม่ใช่ "ต้องตรงทุกไฟล์") — workflow นั้นถูกลบทิ้ง
  # แล้ว และชื่อ check นี้มีเจ้าของเดียวคือไฟล์นี้
  pull_request:
    branches: [master]

# push ถี่มาก (หลาย dev, หลาย commit ต่อนาที) — push ใหม่ยกเลิกรันเก่าที่ยังไม่จบ
# แทนที่จะปล่อยให้ build+test+lint เต็มรอบทุก push ที่มีอันใหม่กว่ามาแซงอยู่แล้ว
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Continuous Integration (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}

    # engines.node ใน package.json บังคับ >=22 — matrix นี้เช็คว่าโค้ดยังรันได้จริงบน LTS
    # ปัจจุบัน (22) และ LTS ถัดไปที่กำลังจะมาแทน (24) ไม่ใช่แค่เวอร์ชันเดียวที่ dev เครื่องนี้ใช้
    # windows-latest เพิ่มเข้ามาเพราะ dev environment จริงของโปรเจกต์นี้คือ Windows —
    # ubuntu-only CI มองไม่เห็น path separator / case-sensitivity bug ที่เกิดเฉพาะบน Windows
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [22, 24]

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # fork PR ไม่ได้รับ org secrets — ใส่ placeholder ที่ไม่ใช่ JWT (gitleaks จับ jwt ใน yaml)
      # mapping test ไม่ต้องพึ่งค่านี้แล้ว แต่ build ยัง bundle supabaseClient.ts
      - name: Prepare Supabase env for CI
        shell: bash
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ]; then
            echo "VITE_SUPABASE_URL=https://ci-placeholder.supabase.co" >> "$GITHUB_ENV"
          else
            echo "VITE_SUPABASE_URL=$VITE_SUPABASE_URL" >> "$GITHUB_ENV"
          fi
          if [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "VITE_SUPABASE_ANON_KEY=ci-build-placeholder-anon-key" >> "$GITHUB_ENV"
          else
            echo "VITE_SUPABASE_ANON_KEY=$VITE_SUPABASE_ANON_KEY" >> "$GITHUB_ENV"
          fi

      - name: Build 3D Models
        run: npm run build:models

      # เรียก `npm run ci` ตรง ๆ ไม่ไล่ขั้นตอนเอง — package.json เป็นแหล่งความจริงเดียวของ
      # "ด่านทั้งหมดมีอะไรบ้าง" เติมด่านที่นั่นที่เดียวแล้ว job นี้กับ deploy.yml ได้ตามทันที
      #
      # ก่อนหน้านี้ job นี้ก๊อปขั้นตอนมาเรียงเอง แล้ว drift จริง: format:check,
      # check-lcp-preload และ verify-memory-archive อยู่ใน `npm run ci` แต่ไม่เคยรันบน push
      # เลยสักครั้ง (deploy.yml ที่เรียกตรง ๆ ถูก skip ทุก push ที่ไม่ bump เวอร์ชัน)
      # deploy.yml บรรทัด 172-175 เตือน drift รูปแบบนี้ไว้เอง — ที่นี่เคยเป็นตัวอย่างของมัน
      #
      # tee เก็บ log ไว้ให้ขั้นตอนสรุปด้านล่างดึงทั้ง coverage และ bundle size ออกมาจากไฟล์
      # เดียว — สองอย่างนี้คือเหตุผลเดิมที่ job นี้ไม่ยอมเรียก `npm run ci`
      #
      # shell: bash บังคับ — set -o pipefail/tee เป็น bash syntax, pwsh (default ของ
      # windows-latest) parse ไม่ผ่าน; Git Bash มากับ windows runner อยู่แล้ว
      - name: Run the full CI pipeline
        shell: bash
        env:
          # public site key (ไม่ใช่ secret จริง — ออกแบบมาให้ฝังใน client bundle ได้)
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
        run: |
          set -o pipefail
          npm run ci 2>&1 | tee ci-output.log

      # if: always() เพื่อให้ยังเห็นตัวเลขตอนด่านหลังพัง — แต่ถ้า `npm run ci` ตายก่อนถึงด่าน
      # นั้น บล็อกที่ดึงจะว่าง จึงเขียนบรรทัดบอกแทนการแปะกล่องเปล่าให้คนอ่านเดาเอง
      - name: Add coverage + bundle size to the job summary
        if: always()
        shell: bash
        run: |
          summarise() {
            echo "### $1 (Node ${{ matrix.node-version }})" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            if [ -s "$2" ]; then
              cat "$2" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "(ไม่มีผล — pipeline หยุดก่อนถึงด่านนี้)" >> "$GITHUB_STEP_SUMMARY"
            fi
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          }
          awk '/Coverage summary/,0' ci-output.log 2>/dev/null | head -n 6 > coverage-block.txt || true
          grep -E 'เพดาน|ผ่านทั้งหมด|เกินเพดาน' ci-output.log > bundle-block.txt 2>/dev/null || true
          summarise "Test Coverage" coverage-block.txt
          summarise "Bundle size (dist/assets)" bundle-block.txt

  # branch protection ตั้ง required status check ไว้ที่ชื่อ "Continuous Integration" เดี่ยว ๆ
  # (ตั้งไว้ก่อนมี matrix) — matrix ด้านบนทำให้ context จริงกลายเป็น "Continuous Integration
  # (Node 22)" / "(Node 24)" ซึ่งชื่อไม่ตรงกับที่ required ไว้อีกต่อไป งานนี้รวมผลลัพธ์ทุก
  # node-version แล้วรายงานภายใต้ชื่อเดิมเป๊ะ — required check ยังชี้ถูกจุดโดยไม่ต้องไปแก้
  # branch protection ทุกครั้งที่ปรับ matrix
  ci-status:
    name: Continuous Integration
    needs: ci
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: ตรวจว่าทุกเวอร์ชันใน matrix ผ่านหมด
        run: |
          if [ "${{ contains(needs.ci.result, 'failure') || contains(needs.ci.result, 'cancelled') }}" = "true" ]; then
            echo "อย่างน้อยหนึ่ง Node version ใน matrix ไม่ผ่าน" >&2
            exit 1
          fi

  # ตัวตรวจ citation ของ docs/agent-blueprint/** — ไม่พึ่ง dependency ใด ๆ จึงไม่ต้อง npm ci
  # ไม่ได้เป็น required check (branch protection ชี้ที่ "Continuous Integration" อย่างเดียว)
  #
  # REPORT-ONLY ชั่วคราว (`continue-on-error: true` ที่ step ด้านล่าง) — วันแรกที่เพิ่ม job นี้
  # เข้ามา ตัวเช็คตอนนั้นรายงาน MISSING-FILE: 13 อยู่แล้ว (12 ใน 13 เป็นแค่ bare `types.ts`
  # กำกวม ไม่ใช่ path ที่หายไปจริง — citation-hygiene lane เป็นคนไล่ปิด) job จึงแดงทันทีที่ merge
  # เข้า master โดยไม่มีโค้ดใครพังเลย และซ้ำร้ายกว่านั้น: การแก้ตามธรรมชาติคือ commit ที่แตะแค่
  # docs/agent-blueprint/**/*.md ซึ่งเข้าเงื่อนไข `paths-ignore: '**/*.md'` ของ push trigger
  # ด้านบน — workflow นี้จะไม่ re-run บน master เลยจนกว่าจะมี push ที่แตะไฟล์โค้ดอื่นมาบังเอิญ
  # ผ่าน แปลว่า run สีแดงจะค้างเป็น run ล่าสุดของ workflow นี้นานเกินสมควร
  #
  # ใครปิด `continue-on-error` นี้กลับ = citation-hygiene lane เมื่อ MISSING-FILE เหลือ 0
  # (SYMBOL-MISMATCH ปล่อยผ่านได้เสมอ ตัวเช็คเองประกาศว่าเป็น heuristic) และต้องตามด้วย push ที่
  # แตะไฟล์โค้ด (ไม่ใช่แค่ .md) เพื่อให้ workflow นี้ re-run บน master จริง ไม่งั้นสถานะเก่าจะค้าง
  #
  # `tools/check-blueprint-citations.mjs` เองไม่แตะ — ยังคง exit 1 บน MISSING-FILE/PAST-EOF
  # เหมือนเดิม (ตัวเช็คถูกต้องแล้ว ปัญหาอยู่ที่ job นี้ยังไม่ควร block บน backlog ที่มีอยู่ก่อน)
  blueprint-citations:
    name: Blueprint citation check
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Check citations in every mandatory-read document
        continue-on-error: true
        run: node tools/check-blueprint-citations.mjs

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: always

  # Lighthouse CI (audit item B20, 2026-08-16)
  #
  # เกตขนาด bundle ที่มีอยู่ (tools/check-bundle-size.mjs) วัด "ไบต์ที่ส่งออกไป" ได้อย่างเดียว
  # มันไม่รู้ว่าไบต์พวกนั้นแปลว่าอะไรตอน browser จริงเปิดหน้าเว็บ — LCP, blocking time, CLS,
  # a11y ไม่มีตัวไหนอนุมานจาก KB ได้ job นี้เติมส่วนนั้น
  #
  # REPORT-ONLY (`continue-on-error: true`) และ lighthouserc.json **ยังไม่มี assertion สักข้อ**
  # โดยตั้งใจ — ตัวเลขเพดานที่เขียนก่อนวัดคือตัวเลขที่บรรยายสิ่งที่โค้ดทำอยู่แล้ว ไม่ใช่เพดาน
  # (บทเรียนเดียวกับ coverage threshold ใน vite.config.ts) รันแรกคือการวัด รอบถัดไปค่อยใส่เลข
  # ที่ derive จากผลจริง แล้วจึงปิด continue-on-error
  #
  # ทำไม build ใหม่แทนที่จะใช้ dist/ ของ job ci: dist/ ถูก build ด้วย base '/LegendOfSoulTH/'
  # สำหรับ GitHub Pages — LHCI เสิร์ฟ staticDistDir ที่ root ('/') เสมอ ถ้าเอา dist/ ตัวจริงมา
  # เสิร์ฟ asset ทุกตัวจะ 404 หน้าเปล่า แล้ว Lighthouse จะให้คะแนนหน้าเปล่านั้นโดยไม่ error
  # — เขียวสนิทและไม่มีความหมาย ไบต์เท่ากันทุกอย่าง ต่างแค่ prefix ของ URL
  #
  # ไม่ต้องรัน build:images: public/ commit ไว้ในรีโปอยู่แล้ว สคริปต์นั้นสร้างจาก assets/raw/
  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          # audit ไม่ใช่ block — job นี้โหลด Chrome ของ Lighthouse เอง egress จึงกว้างและยัง
          # ไม่เคย derive (ดู security-scan.yml ที่ block ไปแล้วสองตัว, audit item B17)
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # เหมือน job ci ด้านบน — fork PR ไม่ได้รับ org secrets จึงใส่ placeholder ที่ไม่ใช่ JWT
      #
      # ไม่ใช่แค่ก๊อปตามพี่น้อง: รอบแรกของ job นี้ (ccc1133) build โดยไม่มี env เลย ผลคือ
      # initAuthCache() ใน src/main.tsx โยน error, .catch เขียนหน้า "โหลดเกมไม่สำเร็จ" ทับ
      # #root แล้ว Lighthouse ก็ให้ performance 100 / a11y 100 / LCP 526ms กับหน้า error
      # นั้น — LCP element คือ <p> "กรุณาลองรีเฟรชหน้านี้อีกครั้ง" โหลดจริงแค่ 198 KB
      # 13 requests ไม่มีรูปสักไฟล์ เขียวสนิทโดยไม่ได้วัดเกมเลยสักนิด
      - name: Prepare Supabase env for the Lighthouse build
        shell: bash
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ]; then
            echo "VITE_SUPABASE_URL=https://ci-placeholder.supabase.co" >> "$GITHUB_ENV"
          else
            echo "VITE_SUPABASE_URL=$VITE_SUPABASE_URL" >> "$GITHUB_ENV"
          fi
          if [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "VITE_SUPABASE_ANON_KEY=ci-build-placeholder-anon-key" >> "$GITHUB_ENV"
          else
            echo "VITE_SUPABASE_ANON_KEY=$VITE_SUPABASE_ANON_KEY" >> "$GITHUB_ENV"
          fi

      - name: Build with a root base so the static server can resolve every asset
        run: npx vite build --base=/ --outDir dist-lhci --emptyOutDir

      # continue-on-error ถูกถอดออกแล้ว (6e14f24 วัดครบสองรอบ) — lighthouserc.json มีเพดานที่
      # derive จากผลจริงแล้ว เพดานที่แดงไม่ได้ก็เป็นแค่คอมเมนต์ ตัวเลขตั้งหลวมโดยตั้งใจ:
      # มันจับ regression ก้อนใหญ่ ไม่ได้จับ drift — เหตุผลเต็มอยู่ใน _how_these_numbers_were_picked
      - name: Run Lighthouse
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12.6.2
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: false

      # เกตกันคะแนนหลอก — ต้องรันหลัง Lighthouse เพราะหน้า error เกิดตอน runtime เท่านั้น
      # เช็คแบบ static ก่อน build จับไม่ได้ ข้อนี้ไม่ใช่ continue-on-error: คะแนนที่วัดผิดเป้า
      # แย่กว่าไม่มีคะแนน — มันเขียว 100 แล้วไม่มีอะไรบอกว่าผิด
      - name: Fail if Lighthouse measured the bootstrap error screen
        run: node tools/check-lighthouse-target.mjs

      # เกมนี้มี touch D-pad และกฎ compatibility ของมันเองพูดถึงเบราว์เซอร์มือถือ แต่ทุกตัวเลข
      # perf ที่โปรเจกต์นี้อ้าง (perf 100, LCP 515ms, 20ms ที่ preload ซื้อมา) วัดบน desktop
      # preset ทั้งหมด — โปรไฟล์ที่ไม่มีใครวัดคือโปรไฟล์ที่ใกล้กับการเล่นจริงมากกว่า
      # (gold-standard audit 2026-08-19, rank 2)
      #
      # continue-on-error ยังอยู่ และ lighthouserc.mobile.json ยังไม่มี assertion สักข้อ — ท่า
      # เดียวกับที่ desktop เริ่ม (ccc1133) รอบนี้คือการวัด ครบสามรอบแล้วค่อยใส่เลขที่ derive
      # จากผลจริง แล้วจึงถอด continue-on-error ก๊อปเพดานของ desktop ข้ามมาแย่กว่าไม่มี:
      # CPU throttle 4x + slow-4G ทำให้มันเป็นคนละปริมาณที่ใช้ชื่อเดียวกัน
      #
      # รันหลัง target guard เพราะขั้นนี้เขียนทับ .lighthouseci ที่ guard อ่าน — guard ของ mobile
      # จะมาพร้อมเพดานของมัน ไม่ใช่ก่อน
      - name: Run Lighthouse (mobile profile — measuring, not gating)
        continue-on-error: true
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12.6.2
        with:
          configPath: ./lighthouserc.mobile.json
          uploadArtifacts: true
          temporaryPublicStorage: false
