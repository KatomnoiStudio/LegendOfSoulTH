name: CodeQL Analysis

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '**/*.md'
      - '.agents/**'
      - '.coalmine.json'
  pull_request:
    branches: [ master ]
    paths-ignore:
      - '**/*.md'
      - '.agents/**'
      - '.coalmine.json'
  schedule:
    - cron: '0 0 * * 0'

concurrency:
  group: codeql-fork-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [ javascript-typescript ]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v3
