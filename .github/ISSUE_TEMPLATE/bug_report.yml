name: 🐛 Bug Report
description: Create a report to help us improve Legend of Soul-TH
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
      placeholder: Tell us what happened...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps To Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: input
    id: error-code
    attributes:
      label: Error code (รหัสข้อผิดพลาด)
      description: >
        If the game showed a code on screen, paste it here. This game sends no telemetry
        anywhere, so the code you can see is the only stack trace we get.
        ถ้าหน้าจอขึ้นรหัสไว้ ใส่มาด้วย — เกมนี้ไม่ส่งข้อมูลไปที่ไหนเลย รหัสที่คุณเห็นคือ
        เบาะแสเดียวที่เรามี
      placeholder: e.g. LOBBY_SCENE_WEBGPU_INIT_FAIL
    validations:
      required: false
  - type: input
    id: game-version
    attributes:
      label: Game version (เวอร์ชันเกม)
      description: Shown on the title screen and in Settings → ข้อมูลเกม.
      placeholder: e.g. 0.2.0
    validations:
      required: false
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, device details
      placeholder: e.g. Chrome 120, Windows 11
    validations:
      required: false
