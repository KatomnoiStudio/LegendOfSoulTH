<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hanuman Idle V2 — Hole-free Preview</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, "Noto Sans Thai", system-ui, sans-serif;
        background: #070b12;
        color: #f7f2df;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 50% 42%, rgb(31 55 69 / 72%), transparent 42%),
          linear-gradient(145deg, #080b12, #101a24 58%, #070a10);
      }

      main {
        width: min(1000px, 96vw);
        padding: 22px 18px 28px;
        text-align: center;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.35rem, 3vw, 2.2rem);
        color: #ffd66b;
      }

      .subtitle {
        margin: 7px 0 16px;
        color: #bac7cf;
      }

      .stage {
        position: relative;
        width: min(640px, 92vw);
        aspect-ratio: 1 / 1;
        margin: 0 auto;
        overflow: hidden;
        border: 1px solid #9ac4b5;
        border-radius: 18px;
        background:
          repeating-conic-gradient(#eaf4f0 0% 25%, #cde4dc 0% 50%) 50% / 28px 28px;
        box-shadow: none;
      }

      .stage::before {
        content: "";
        position: absolute;
        z-index: 2;
        top: 0;
        left: 50%;
        bottom: 0;
        width: 1px;
        border-left: 1px dashed rgb(72 228 232 / 55%);
        pointer-events: none;
      }

      .stage::after {
        content: "แกนเอว X = 320";
        position: absolute;
        z-index: 3;
        top: 9px;
        left: 50%;
        padding: 2px 8px;
        transform: translateX(-50%);
        border-radius: 999px;
        background: rgb(7 17 24 / 82%);
        color: #75e7eb;
        font-size: 0.72rem;
        white-space: nowrap;
        pointer-events: none;
      }

      .y-axis {
        position: absolute;
        z-index: 3;
        left: 0;
        right: 0;
        top: 91.71875%;
        height: 2px;
        border-top: 2px dashed #e15b3d;
        pointer-events: none;
      }

      .y-axis span {
        position: absolute;
        left: 10px;
        bottom: 6px;
        padding: 2px 7px;
        border-radius: 999px;
        background: #fff8e8;
        color: #9e351e;
        border: 1px solid rgb(225 91 61 / 48%);
        font-weight: 700;
        font-size: 0.72rem;
      }

      #hanuman-idle-stage {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        image-rendering: auto;
      }

      .status {
        display: flex;
        justify-content: center;
        gap: 12px;
        margin: 12px 0;
        color: #dbe5e9;
        font-variant-numeric: tabular-nums;
      }

      .badge {
        padding: 4px 10px;
        border: 1px solid rgb(117 231 235 / 30%);
        border-radius: 999px;
        background: rgb(8 22 29 / 78%);
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 9px;
      }

      button,
      input {
        min-height: 44px;
      }

      button {
        padding: 0 16px;
        border: 1px solid rgb(255 214 107 / 45%);
        border-radius: 10px;
        background: #1a2630;
        color: #fff5d5;
        font: inherit;
        cursor: pointer;
      }

      button:hover,
      button:focus-visible {
        background: #263a47;
        outline: 2px solid #ffd66b;
        outline-offset: 2px;
      }

      label {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 44px;
        padding: 0 12px;
        border-radius: 10px;
        background: rgb(17 29 38 / 75%);
      }

      input[type="range"] {
        width: min(220px, 42vw);
      }

      .strip {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 8px;
        width: min(720px, 94vw);
        margin: 16px auto 0;
      }

      .thumb {
        position: relative;
        padding: 0;
        aspect-ratio: 1 / 1;
        overflow: hidden;
        background:
          repeating-conic-gradient(#eaf4f0 0% 25%, #cde4dc 0% 50%) 50% / 16px 16px;
      }

      .thumb[data-active="true"] {
        border-color: #72e5e9;
        box-shadow: 0 0 0 2px #72e5e9;
      }

      .thumb img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        pointer-events: none;
      }

      .thumb span {
        position: absolute;
        right: 5px;
        bottom: 4px;
        padding: 1px 6px;
        border-radius: 999px;
        background: rgb(0 0 0 / 72%);
        font-size: 0.68rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>หนุมาน — Idle V2 ไม่มีรู</h1>
      <p class="subtitle">4 ท่าใหม่ · 8 Playback Ticks: 1 → 1 → 2 → 2 → 3 → 3 → 4 → 4 · พื้นหลังโปร่งใสและเส้นตัวละครครบ</p>

      <section class="stage" aria-label="ตัวอย่างแอนิเมชันหนุมาน Idle">
        <img
          id="hanuman-idle-stage"
          src="characters/hanuman-idle-holefree-v2/idle-1.png?v=holefree-v2"
          alt="หนุมานท่ายืน Idle"
          width="640"
          height="640"
        />
        <div class="y-axis" aria-hidden="true"><span>แกน Y = 587 · แนวเท้า</span></div>
      </section>

      <div class="status" aria-live="polite">
        <span class="badge" id="frame-status">กำลังเตรียม 8 เฟรม…</span>
        <span class="badge">Root drift: Y ≤ 1px · Canvas 640×640</span>
      </div>

      <div class="controls">
        <button type="button" id="previous">◀ ก่อนหน้า</button>
        <button type="button" id="toggle">หยุด</button>
        <button type="button" id="next">ถัดไป ▶</button>
        <label>
          ความเร็ว
          <input id="speed" type="range" min="160" max="600" step="20" value="300" />
          <output id="speed-value">300 ms</output>
        </label>
      </div>

      <div class="strip" id="frame-strip" aria-label="ลำดับเฟรมทั้งหมด"></div>
    </main>

    <script>
      const sourceLabels = [1, 1, 2, 2, 3, 3, 4, 4]
      const frameUrls = sourceLabels.map(
        (sourceFrame) =>
          `characters/hanuman-idle-holefree-v2/idle-${sourceFrame}.png?v=holefree-v2`,
      )
      const stage = document.querySelector('#hanuman-idle-stage')
      const strip = document.querySelector('#frame-strip')
      const status = document.querySelector('#frame-status')
      const toggle = document.querySelector('#toggle')
      const speed = document.querySelector('#speed')
      const speedValue = document.querySelector('#speed-value')
      let frameIndex = 0
      let playing = true
      let timer

      async function preloadFrame(url) {
        const image = new Image()
        image.src = url
        await image.decode()
        return image
      }

      frameUrls.forEach((url, index) => {
        const button = document.createElement('button')
        const image = document.createElement('img')
        const label = document.createElement('span')
        button.type = 'button'
        button.className = 'thumb'
        button.dataset.active = String(index === 0)
        button.setAttribute('aria-label', `ดูเฟรม ${index + 1}`)
        image.src = url
        image.alt = ''
        label.textContent = `V2 ท่า ${sourceLabels[index]}`
        button.append(image, label)
        button.addEventListener('click', () => showFrame(index))
        strip.append(button)
      })

      function showFrame(index) {
        frameIndex = (index + frameUrls.length) % frameUrls.length
        stage.src = frameUrls[frameIndex]
        status.textContent = `Tick ${frameIndex + 1} / ${frameUrls.length} · V2 ท่า ${sourceLabels[frameIndex]}`
        document.querySelectorAll('.thumb').forEach((thumb, thumbIndex) => {
          thumb.dataset.active = String(thumbIndex === frameIndex)
        })
      }

      function schedule() {
        window.clearInterval(timer)
        if (!playing) return
        timer = window.setInterval(() => showFrame(frameIndex + 1), Number(speed.value))
      }

      document.querySelector('#previous').addEventListener('click', () => {
        showFrame(frameIndex - 1)
        schedule()
      })
      document.querySelector('#next').addEventListener('click', () => {
        showFrame(frameIndex + 1)
        schedule()
      })
      toggle.addEventListener('click', () => {
        playing = !playing
        toggle.textContent = playing ? 'หยุด' : 'เล่น'
        schedule()
      })
      speed.addEventListener('input', () => {
        speedValue.textContent = `${speed.value} ms`
        schedule()
      })

      async function startPreview() {
        await Promise.all(frameUrls.map(preloadFrame))
        showFrame(0)
        schedule()
      }

      startPreview().catch(() => {
        playing = false
        toggle.textContent = 'เล่น'
        status.textContent = 'โหลดภาพไม่ครบ — ลองรีเฟรชหน้า Preview'
      })
    </script>
  </body>
</html>
