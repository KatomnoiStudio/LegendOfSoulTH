<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Erlang Shen Skill 1 — Animation Preview</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #111827; color: #f8fafc; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      main { width: min(100%, 780px); }
      h1 { margin: 0; font-size: 1.25rem; }
      p { color: #cbd5e1; margin: 8px 0 16px; }
      .stage { background: conic-gradient(#d7dde7 25%, #b5bdca 0 50%, #d7dde7 0 75%, #b5bdca 0) 0 / 32px 32px; border: 1px solid #475569; border-radius: 12px; overflow: hidden; aspect-ratio: 5 / 4; display: grid; place-items: center; }
      #sprite { width: 100%; height: 100%; object-fit: contain; image-rendering: auto; }
      .controls { display: grid; grid-template-columns: auto auto auto 1fr; gap: 10px; align-items: center; margin-top: 14px; }
      button { border: 1px solid #64748b; background: #1e293b; color: inherit; border-radius: 8px; min-height: 42px; padding: 0 14px; font: inherit; cursor: pointer; }
      button:hover, button:focus-visible { background: #334155; outline: 2px solid #60a5fa; outline-offset: 2px; }
      #frame-scrubber { width: 100%; accent-color: #60a5fa; }
      #frame-label, #status { font-variant-numeric: tabular-nums; }
      #status { min-height: 1.5em; color: #93c5fd; margin-top: 12px; }
      @media (max-width: 560px) { .controls { grid-template-columns: repeat(3, 1fr); } #frame-scrubber { grid-column: 1 / -1; } }
    </style>
  </head>
  <body>
    <main>
      <h1>Erlang Shen — Skill 1</h1>
      <p>Preview เรียงเฟรม 1–16 ที่ความเร็วในเกม 14 FPS</p>
      <div class="stage"><img id="sprite" alt="Erlang Shen Skill 1 animation frame" /></div>
      <div class="controls" aria-label="Animation controls">
        <button id="previous-frame" type="button" aria-label="เฟรมก่อนหน้า">◀</button>
        <button id="play-pause" type="button" aria-pressed="true">หยุด</button>
        <button id="next-frame" type="button" aria-label="เฟรมถัดไป">▶</button>
        <input id="frame-scrubber" type="range" min="1" max="16" value="1" aria-label="เลือกเฟรม" />
      </div>
      <p id="frame-label">เฟรม 01 / 16</p>
      <div id="status" role="status" aria-live="polite">กำลังเล่น…</div>
    </main>
    <script>
      const FRAME_COUNT = 16
      const FPS = 14
      const framePaths = Array.from(
        { length: FRAME_COUNT },
        (_, index) => `../erlang-shen-skill-1-${index}.webp?v=frame14-spill-fix`,
      )
      const sprite = document.querySelector('#sprite')
      const scrubber = document.querySelector('#frame-scrubber')
      const label = document.querySelector('#frame-label')
      const status = document.querySelector('#status')
      const playPause = document.querySelector('#play-pause')
      let frameIndex = 0
      let playing = true
      let previousTime = performance.now()
      let accumulated = 0

      const render = () => {
        sprite.src = framePaths[frameIndex]
        scrubber.value = String(frameIndex + 1)
        label.textContent = `เฟรม ${String(frameIndex + 1).padStart(2, '0')} / ${FRAME_COUNT}`
      }

      const setPlaying = (nextPlaying) => {
        playing = nextPlaying
        playPause.textContent = playing ? 'หยุด' : 'เล่น'
        playPause.setAttribute('aria-pressed', String(playing))
        status.textContent = playing ? 'กำลังเล่น…' : 'หยุดที่เฟรม ' + (frameIndex + 1)
        previousTime = performance.now()
        accumulated = 0
      }

      const showFrame = (nextIndex) => {
        frameIndex = Math.max(0, Math.min(FRAME_COUNT - 1, nextIndex))
        render()
        if (!playing) status.textContent = 'หยุดที่เฟรม ' + (frameIndex + 1)
      }

      const tick = (time) => {
        if (playing) {
          accumulated += time - previousTime
          const frameDuration = 1000 / FPS
          if (accumulated >= frameDuration) {
            const advanceBy = Math.floor(accumulated / frameDuration)
            accumulated %= frameDuration
            if (frameIndex + advanceBy >= FRAME_COUNT) {
              showFrame(FRAME_COUNT - 1)
              setPlaying(false)
              status.textContent = 'จบ Skill 1 — เกมจะกลับ Idle'
            } else {
              showFrame(frameIndex + advanceBy)
            }
          }
        }
        previousTime = time
        requestAnimationFrame(tick)
      }

      document.querySelector('#previous-frame').addEventListener('click', () => { setPlaying(false); showFrame(frameIndex - 1) })
      document.querySelector('#next-frame').addEventListener('click', () => { setPlaying(false); showFrame(frameIndex + 1) })
      playPause.addEventListener('click', () => {
        if (!playing && frameIndex === FRAME_COUNT - 1) showFrame(0)
        setPlaying(!playing)
      })
      scrubber.addEventListener('input', (event) => { setPlaying(false); showFrame(Number(event.target.value) - 1) })

      framePaths.forEach((path) => { const preload = new Image(); preload.src = path })
      render()
      requestAnimationFrame(tick)
    </script>
  </body>
</html>
