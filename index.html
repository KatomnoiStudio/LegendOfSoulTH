<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <!--
      CSP ผ่าน meta tag เพราะ GitHub Pages ตั้ง custom HTTP header เองไม่ได้ (ไม่มี server ให้ตั้ง)
      หมายเหตุ: frame-ancestors/report-uri/sandbox ใช้ผ่าน meta ไม่ได้ (ต้องเป็น HTTP header เท่านั้น
      ตามสเปก) ป้องกัน clickjacking แบบเต็มรูปแบบต้องมี CDN (เช่น Cloudflare) มาคั่นหน้า GH Pages
      ก่อน — เป็นข้อจำกัดที่ยอมรับของ deploy target นี้ ไม่ใช่ช่องโหว่ที่มองข้าม

      base-uri เป็น 'none' ไม่ใช่ 'self' — OWASP ASVS 5.0.0 V3.4.3 ระบุขั้นต่ำไว้เป็น 'none' ตรง ๆ
      หน้านี้ไม่มี <base> tag เลย (ตรวจแล้วทั้ง index.html และผลลัพธ์ใน dist/) การห้ามทั้งหมด
      จึงไม่กระทบอะไร และปิดช่องที่ script injection จะเปลี่ยนฐาน URL ของทุก relative path

      style-src ต้องมี 'unsafe-inline' เพราะแอปนี้ใช้ inline style prop ของ React ใส่ CSS custom
      property (พื้นหลังรูปที่ต้องต่อกับ Vite base path แบบไดนามิก — ดู src/lib/publicUrl.ts)
      ทั่วทั้งแอป ไม่มีทางเลี่ยงโดยไม่เขียนใหม่ทั้งระบบ — ความเสี่ยงของ style injection แคบกว่า
      script injection มาก จึงเป็นข้อแลกเปลี่ยนที่ยอมรับได้

      connect-src เพิ่ม *.supabase.co (https + wss) สำหรับ src/lib/supabaseClient.ts — ใช้ wildcard
      แทน hostname โปรเจกต์เจาะจง เพราะ ref เปลี่ยนได้ถ้าย้าย/สร้างโปรเจกต์ Supabase ใหม่ ยืนยันแล้ว
      ว่าไม่มีการเชื่อมต่อ third-party อื่นในแอปที่ต้องเปิดเพิ่ม (ตรวจสอบด้วยการเชื่อมต่อจริงและดู
      CSP violation ใน console — ก่อนแก้เจอ error "Refused to connect... violates connect-src 'self'")

      script-src/frame-src เพิ่ม challenges.cloudflare.com สำหรับ Cloudflare Turnstile CAPTCHA
      (AuthModal.tsx) — ค่าตาม official reference: developers.cloudflare.com/turnstile/reference/
      content-security-policy/ (verified 2026-08-08). connect-src ก็ต้องเปิดด้วย เพราะ widget ยิง
      verify request ตรงไปโดเมนนี้เอง ไม่ผ่าน 'self'
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'none';"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      ห้ามใส่ user-scalable=no — บล็อก pinch-zoom ทั้งหมด ผิด WCAG 2.2 AA (SC 1.4.4/1.4.10)
      ตรง ๆ (gold-standard UX audit, 2026-08-06) เช็คแล้วไม่มีอะไรในแอปพึ่งการล็อกซูมนี้
      (ทุก layout ใช้ vw/vh/responsive ธรรมดา, canvas 3D วัดขนาดจาก ResizeObserver ไม่ใช่ viewport
      transform) — เอาออกแล้วไม่กระทบอะไร
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070911" />
    <meta
      name="description"
      content="Legend of Soul-TH เกม RPG ต่อสู้เรียลไทม์ ที่ปลุกเหล่านักรบในตำนานให้กลับมามีชีวิตอีกครั้ง"
    />
    <title>Legend of Soul-TH</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Cloudflare Turnstile CAPTCHA widget — AuthModal.tsx calls window.turnstile.render() -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
